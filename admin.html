<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка — Lexstore</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/brand/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="admin.css?v=4">
</head>
<body>

<header class="admin-header">
  <a class="brand" href="index.html">
    <img src="assets/brand/logo.jpg" alt="Lexstore">
    <span>Lexstore</span>
  </a>
  <span class="admin-header__label">Админка</span>
  <button class="btn btn--outline admin-logout" type="button" data-logout hidden>
    <span class="btn__fill"></span>
    <span class="btn__label">Выйти</span>
  </button>
</header>

<main class="wrap admin-main">

  <section class="admin-login" data-admin-login>
    <h1>Вход</h1>
    <p>Доступ только для сотрудников Lexstore.</p>
    <form class="admin-login__form" data-login-form novalidate>
      <div class="form-field">
        <label for="a-email">Email</label>
        <input id="a-email" type="email" name="email" autocomplete="username" required>
      </div>
      <div class="form-field">
        <label for="a-password">Пароль</label>
        <input id="a-password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <p class="admin-login__error" data-login-error hidden></p>
      <button class="btn btn--solid" type="submit">
        <span class="btn__fill"></span>
        <span class="btn__label">Войти</span>
      </button>
    </form>
  </section>

  <section class="admin-app" data-admin-app hidden>
    <div class="admin-tabs">
      <button type="button" class="admin-tab is-active" data-admin-tab="products">Товары</button>
      <button type="button" class="admin-tab" data-admin-tab="orders">Заказы</button>
    </div>

    <div class="admin-panel" data-admin-panel="products">
      <h2>Добавить товар</h2>
      <form class="admin-add-form" data-add-product-form>
        <input type="text" name="id" placeholder="Артикул (id), например new-item" required>
        <input type="text" name="name" placeholder="Название" required>
        <select name="cat"></select>
        <input type="number" name="price" placeholder="Цена" min="0" required>
        <input type="number" name="old_price" placeholder="Старая цена (необязательно)" min="0">
        <label class="admin-file-field">
          <span>Фото товара</span>
          <input type="file" name="images" accept="image/*" multiple>
        </label>
        <textarea name="description" placeholder="Описание товара (необязательно)" rows="3"></textarea>
        <button class="btn btn--solid" type="submit">
          <span class="btn__fill"></span>
          <span class="btn__label">Добавить</span>
        </button>
      </form>

      <h2>Все товары</h2>
      <p class="admin-status" data-products-status>Загрузка…</p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Фото</th>
              <th>Название</th>
              <th>Категория</th>
              <th>Цена</th>
              <th>Старая цена</th>
              <th>Описание</th>
              <th>В наличии</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-products-body></tbody>
        </table>
      </div>
    </div>

    <div class="admin-panel" data-admin-panel="orders" hidden>
      <div class="admin-panel__head">
        <h2>Заказы</h2>
        <button class="btn btn--outline admin-btn-sm" type="button" data-refresh-orders>
          <span class="btn__fill"></span>
          <span class="btn__label">Обновить</span>
        </button>
      </div>
      <p class="admin-status" data-orders-status>Загрузка…</p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>№</th>
              <th>Дата</th>
              <th>Клиент</th>
              <th>Получение</th>
              <th>Товары</th>
              <th>Сумма</th>
              <th>Комментарий</th>
              <th>Статус</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-orders-body></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="admin.js?v=4"></script>
</body>
</html>
